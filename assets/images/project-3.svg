<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>
    <linearGradient id="glow-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#p3-bg)" />

  <!-- Connecting Node Network -->
  <g stroke="#dc2626" stroke-width="1.5" opacity="0.3">
    <line x1="120" y1="180" x2="220" y2="110"/>
    <line x1="120" y1="180" x2="220" y2="250"/>
    <line x1="220" y1="110" x2="350" y2="140"/>
    <line x1="220" y1="250" x2="350" y2="220"/>
    <line x1="350" y1="140" x2="480" y2="190"/>
    <line x1="350" y1="220" x2="480" y2="190"/>
    <line x1="220" y1="110" x2="220" y2="250"/>
    <line x1="350" y1="140" x2="350" y2="220"/>
  </g>

  <!-- Central Visual Matrix -->
  <g transform="translate(300, 185)">
    <circle r="120" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.3"/>
    <circle r="90" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <circle r="60" fill="#200a0e" stroke="url(#glow-red)" stroke-width="3" filter="url(#ai-glow)"/>
    
    <!-- Spark / Compass Icon inside -->
    <path d="M-15,-5 L0,-25 L15,-5 L35,0 L15,5 L0,25 L-15,5 L-35,0 Z" fill="#fbbf24" />
  </g>

  <!-- Node Dots -->
  <circle cx="120" cy="180" r="8" fill="#ef4444"/>
  <circle cx="220" cy="110" r="10" fill="#f59e0b"/>
  <circle cx="220" cy="250" r="10" fill="#dc2626"/>
  <circle cx="350" cy="140" r="10" fill="#fbbf24"/>
  <circle cx="350" cy="220" r="10" fill="#ef4444"/>
  <circle cx="480" cy="190" r="12" fill="#f59e0b"/>

  <!-- Code/Data Overlay HUD -->
  <g transform="translate(40, 290)">
    <rect width="220" height="50" rx="6" fill="#09090d" opacity="0.9" stroke="#3f1a24" stroke-width="1"/>
    <rect x="15" y="15" width="80" height="6" rx="2" fill="#ef4444"/>
    <rect x="15" y="28" width="140" height="5" rx="2" fill="#71717a"/>
    <circle cx="195" cy="25" r="5" fill="#22c55e"/>
  </g>

  <g transform="translate(340, 40)">
    <rect width="220" height="50" rx="6" fill="#09090d" opacity="0.9" stroke="#3f1a24" stroke-width="1"/>
    <rect x="15" y="15" width="100" height="6" rx="2" fill="#f59e0b"/>
    <rect x="15" y="28" width="150" height="5" rx="2" fill="#71717a"/>
    <circle cx="195" cy="25" r="5" fill="#ef4444"/>
  </g>
</svg>
