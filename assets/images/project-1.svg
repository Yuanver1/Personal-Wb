<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="p1-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="380" fill="url(#p1-bg)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(50, 40)" filter="url(#p1-shadow)">
    <!-- Window Frame -->
    <rect width="500" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="500" height="36" rx="12" fill="#0f172a" />
    <rect y="24" width="500" height="12" fill="#0f172a" />
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#eab308" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <!-- URL Bar -->
    <rect x="80" y="9" width="340" height="18" rx="6" fill="#1e293b" opacity="0.8"/>
    <rect x="90" y="15" width="120" height="6" rx="3" fill="#64748b" />

    <!-- Window Content Area -->
    <!-- Sidebar -->
    <rect x="15" y="50" width="80" height="235" rx="6" fill="#0f172a" opacity="0.6"/>
    <rect x="25" y="65" width="60" height="8" rx="4" fill="url(#card-grad)"/>
    <rect x="25" y="85" width="45" height="6" rx="3" fill="#475569"/>
    <rect x="25" y="100" width="50" height="6" rx="3" fill="#475569"/>
    <rect x="25" y="115" width="40" height="6" rx="3" fill="#475569"/>

    <!-- Main Dashboard -->
    <!-- Header Banner -->
    <rect x="105" y="50" width="380" height="55" rx="8" fill="url(#card-grad)" opacity="0.9"/>
    <rect x="120" y="65" width="140" height="10" rx="5" fill="#ffffff"/>
    <rect x="120" y="82" width="220" height="6" rx="3" fill="#ffffff" opacity="0.7"/>

    <!-- Stat Cards -->
    <g transform="translate(105, 115)">
      <rect width="115" height="60" rx="6" fill="#0f172a"/>
      <rect x="10" y="12" width="40" height="6" rx="3" fill="#64748b"/>
      <rect x="10" y="28" width="60" height="14" rx="4" fill="#38bdf8"/>
    </g>
    <g transform="translate(230, 115)">
      <rect width="115" height="60" rx="6" fill="#0f172a"/>
      <rect x="10" y="12" width="40" height="6" rx="3" fill="#64748b"/>
      <rect x="10" y="28" width="50" height="14" rx="4" fill="#a855f7"/>
    </g>
    <g transform="translate(355, 115)">
      <rect width="130" height="60" rx="6" fill="#0f172a"/>
      <rect x="10" y="12" width="50" height="6" rx="3" fill="#64748b"/>
      <rect x="10" y="28" width="70" height="14" rx="4" fill="#4ade80"/>
    </g>

    <!-- Chart / Visual area -->
    <rect x="105" y="185" width="380" height="100" rx="8" fill="#0f172a"/>
    <!-- Line graph simulation -->
    <polyline points="120,260 160,240 200,245 240,220 280,230 320,205 360,215 400,198 440,210 470,195" 
              fill="none" stroke="url(#accent-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="470" cy="195" r="4" fill="#38bdf8"/>
  </g>
</svg>
