<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="p1-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="380" fill="url(#p1-bg)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(50, 40)" filter="url(#p1-shadow)">
    <rect width="500" height="300" rx="10" fill="#121218" stroke="#2a151b" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="500" height="36" rx="10" fill="#09090d" />
    <rect y="24" width="500" height="12" fill="#09090d" />
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <!-- URL Bar -->
    <rect x="80" y="9" width="340" height="18" rx="4" fill="#1a1a22" opacity="0.9"/>
    <rect x="90" y="15" width="140" height="6" rx="3" fill="#dc2626" opacity="0.8"/>

    <!-- Window Content Area -->
    <!-- Sidebar -->
    <rect x="15" y="50" width="80" height="235" rx="6" fill="#09090d" opacity="0.8"/>
    <rect x="25" y="65" width="60" height="8" rx="4" fill="url(#card-grad)"/>
    <rect x="25" y="85" width="45" height="6" rx="3" fill="#3f3f46"/>
    <rect x="25" y="100" width="50" height="6" rx="3" fill="#3f3f46"/>
    <rect x="25" y="115" width="40" height="6" rx="3" fill="#3f3f46"/>

    <!-- Main Dashboard -->
    <rect x="105" y="50" width="380" height="55" rx="6" fill="url(#card-grad)" opacity="0.9"/>
    <rect x="120" y="65" width="160" height="10" rx="3" fill="#ffffff"/>
    <rect x="120" y="82" width="230" height="6" rx="2" fill="#ffffff" opacity="0.75"/>

    <!-- Stat Cards -->
    <g transform="translate(105, 115)">
      <rect width="115" height="60" rx="6" fill="#09090d" stroke="#27272a" stroke-width="1"/>
      <rect x="10" y="12" width="45" height="6" rx="3" fill="#71717a"/>
      <rect x="10" y="28" width="65" height="14" rx="3" fill="#ef4444"/>
    </g>
    <g transform="translate(230, 115)">
      <rect width="115" height="60" rx="6" fill="#09090d" stroke="#27272a" stroke-width="1"/>
      <rect x="10" y="12" width="45" height="6" rx="3" fill="#71717a"/>
      <rect x="10" y="28" width="55" height="14" rx="3" fill="#f59e0b"/>
    </g>
    <g transform="translate(355, 115)">
      <rect width="130" height="60" rx="6" fill="#09090d" stroke="#27272a" stroke-width="1"/>
      <rect x="10" y="12" width="50" height="6" rx="3" fill="#71717a"/>
      <rect x="10" y="28" width="75" height="14" rx="3" fill="#e11d48"/>
    </g>

    <!-- Chart / Visual area -->
    <rect x="105" y="185" width="380" height="100" rx="6" fill="#09090d" stroke="#27272a" stroke-width="1"/>
    <!-- Line graph simulation -->
    <polyline points="120,260 160,235 200,240 240,210 280,225 320,195 360,205 400,190 440,200 470,185" 
              fill="none" stroke="url(#accent-gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="470" cy="185" r="4" fill="#f59e0b"/>
  </g>
</svg>
