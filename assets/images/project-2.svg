<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="phone-screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="p2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#p2-bg)" />

  <!-- Background decorative floating circles -->
  <circle cx="150" cy="120" r="80" fill="#ec4899" opacity="0.1" filter="blur(40px)"/>
  <circle cx="450" cy="260" r="100" fill="#8b5cf6" opacity="0.15" filter="blur(40px)"/>

  <!-- Phone 1 (Left slightly tilted/behind) -->
  <g transform="translate(160, 40) rotate(-6)" opacity="0.85" filter="url(#p2-shadow)">
    <rect width="140" height="280" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="6" width="128" height="268" rx="16" fill="#0f172a"/>
    <!-- Card inside screen -->
    <rect x="14" y="20" width="112" height="60" rx="8" fill="#334155"/>
    <rect x="22" y="32" width="60" height="8" rx="4" fill="#f43f5e"/>
    <rect x="14" y="90" width="112" height="40" rx="6" fill="#1e293b"/>
    <rect x="14" y="140" width="112" height="40" rx="6" fill="#1e293b"/>
  </g>

  <!-- Phone 2 (Main Foreground) -->
  <g transform="translate(290, 30) rotate(4)" filter="url(#p2-shadow)">
    <!-- Body -->
    <rect width="150" height="300" rx="24" fill="#0f172a" stroke="#6366f1" stroke-width="2.5"/>
    <!-- Screen -->
    <rect x="6" y="6" width="138" height="288" rx="18" fill="#020617"/>
    <!-- Dynamic Island / Notch -->
    <rect x="50" y="12" width="50" height="12" rx="6" fill="#0f172a"/>
    
    <!-- App Header Banner -->
    <rect x="12" y="35" width="126" height="80" rx="12" fill="url(#phone-screen-grad)"/>
    <circle cx="36" cy="65" r="16" fill="#ffffff" opacity="0.9"/>
    <rect x="60" y="55" width="65" height="8" rx="4" fill="#ffffff"/>
    <rect x="60" y="70" width="45" height="6" rx="3" fill="#ffffff" opacity="0.8"/>

    <!-- App Content Cards -->
    <rect x="12" y="125" width="126" height="45" rx="8" fill="#1e293b"/>
    <circle cx="28" cy="147" r="8" fill="#38bdf8"/>
    <rect x="44" y="140" width="55" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="44" y="150" width="35" height="4" rx="2" fill="#64748b"/>

    <rect x="12" y="180" width="126" height="45" rx="8" fill="#1e293b"/>
    <circle cx="28" cy="202" r="8" fill="#a855f7"/>
    <rect x="44" y="195" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="44" y="205" width="40" height="4" rx="2" fill="#64748b"/>

    <!-- Bottom Navigation Bar -->
    <rect x="12" y="240" width="126" height="35" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="35" cy="257" r="4" fill="#ec4899"/>
    <circle cx="75" cy="257" r="4" fill="#64748b"/>
    <circle cx="115" cy="257" r="4" fill="#64748b"/>
  </g>
</svg>
