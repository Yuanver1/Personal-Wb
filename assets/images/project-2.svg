<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>
    <linearGradient id="phone-screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="p2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#p2-bg)" />

  <!-- Background decorative floating circles -->
  <circle cx="150" cy="120" r="80" fill="#dc2626" opacity="0.12" filter="blur(40px)"/>
  <circle cx="450" cy="260" r="100" fill="#f59e0b" opacity="0.1" filter="blur(40px)"/>

  <!-- Phone 1 (Left slightly tilted/behind) -->
  <g transform="translate(160, 40) rotate(-6)" opacity="0.85" filter="url(#p2-shadow)">
    <rect width="140" height="280" rx="18" fill="#181820" stroke="#3f1a24" stroke-width="2"/>
    <rect x="6" y="6" width="128" height="268" rx="14" fill="#09090d"/>
    <!-- Card inside screen -->
    <rect x="14" y="20" width="112" height="60" rx="6" fill="#1f1f28"/>
    <rect x="22" y="32" width="60" height="8" rx="3" fill="#ef4444"/>
    <rect x="14" y="90" width="112" height="40" rx="6" fill="#181820"/>
    <rect x="14" y="140" width="112" height="40" rx="6" fill="#181820"/>
  </g>

  <!-- Phone 2 (Main Foreground) -->
  <g transform="translate(290, 30) rotate(4)" filter="url(#p2-shadow)">
    <!-- Body -->
    <rect width="150" height="300" rx="22" fill="#09090d" stroke="#dc2626" stroke-width="2"/>
    <!-- Screen -->
    <rect x="6" y="6" width="138" height="288" rx="16" fill="#050508"/>
    <!-- Dynamic Island / Notch -->
    <rect x="50" y="12" width="50" height="12" rx="6" fill="#09090d"/>
    
    <!-- App Header Banner -->
    <rect x="12" y="35" width="126" height="80" rx="10" fill="url(#phone-screen-grad)"/>
    <circle cx="36" cy="65" r="16" fill="#ffffff" opacity="0.9"/>
    <rect x="60" y="55" width="65" height="8" rx="3" fill="#ffffff"/>
    <rect x="60" y="70" width="45" height="6" rx="2" fill="#fef3c7" opacity="0.9"/>

    <!-- App Content Cards -->
    <rect x="12" y="125" width="126" height="45" rx="6" fill="#181822"/>
    <circle cx="28" cy="147" r="8" fill="#ef4444"/>
    <rect x="44" y="140" width="55" height="6" rx="2" fill="#d1d1db"/>
    <rect x="44" y="150" width="35" height="4" rx="2" fill="#71717a"/>

    <rect x="12" y="180" width="126" height="45" rx="6" fill="#181822"/>
    <circle cx="28" cy="202" r="8" fill="#f59e0b"/>
    <rect x="44" y="195" width="60" height="6" rx="2" fill="#d1d1db"/>
    <rect x="44" y="205" width="40" height="4" rx="2" fill="#71717a"/>

    <!-- Bottom Navigation Bar -->
    <rect x="12" y="240" width="126" height="35" rx="8" fill="#09090d" stroke="#27272a" stroke-width="1"/>
    <circle cx="35" cy="257" r="4" fill="#ef4444"/>
    <circle cx="75" cy="257" r="4" fill="#71717a"/>
    <circle cx="115" cy="257" r="4" fill="#71717a"/>
  </g>
</svg>
