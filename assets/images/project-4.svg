<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="term-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <filter id="p4-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#p4-bg)" />

  <!-- Code / Terminal Mockup -->
  <g transform="translate(60, 40)" filter="url(#p4-shadow)">
    <!-- Terminal Shell Frame -->
    <rect width="480" height="300" rx="14" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="480" height="38" rx="14" fill="url(#term-header)"/>
    <rect y="26" width="480" height="12" fill="url(#term-header)"/>
    
    <circle cx="22" cy="19" r="6" fill="#f38ba8"/>
    <circle cx="42" cy="19" r="6" fill="#f9e2af"/>
    <circle cx="62" cy="19" r="6" fill="#a6e3a1"/>
    
    <!-- Terminal Tab title text -->
    <text x="240" y="24" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">terminal ~ dev-toolkit</text>

    <!-- Terminal Content / Code lines -->
    <g transform="translate(25, 65)" font-family="monospace" font-size="13" font-weight="600">
      <!-- Line 1 -->
      <text x="0" y="20" fill="#a6e3a1">➜</text>
      <text x="20" y="20" fill="#89b4fa">~/projects</text>
      <text x="110" y="20" fill="#cdd6f4">git clone toolkit-cli</text>
      
      <!-- Line 2 -->
      <text x="0" y="50" fill="#a6adc8">[1/4] Resolving packages...</text>
      <text x="0" y="75" fill="#a6adc8">[2/4] Linking dependencies...</text>
      <text x="0" y="100" fill="#a6e3a1">✔ Build completed in 240ms!</text>

      <!-- Line 3 Code Block -->
      <g transform="translate(0, 125)">
        <rect width="430" height="85" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
        <text x="15" y="25" fill="#f38ba8">const</text>
        <text x="65" y="25" fill="#89b4fa">engine</text>
        <text x="125" y="25" fill="#cdd6f4">=</text>
        <text x="145" y="25" fill="#fab387">createEngine</text>
        <text x="245" y="25" fill="#cdd6f4">({</text>
        <text x="35" y="50" fill="#cdd6f4">mode:</text>
        <text x="85" y="50" fill="#a6e3a1">'ultra-fast'</text>
        <text x="180" y="50" fill="#cdd6f4">,</text>
        <text x="195" y="50" fill="#cdd6f4">plugins:</text>
        <text x="270" y="50" fill="#cdd6f4">[</text>
        <text x="280" y="50" fill="#f9e2af">CorePlugin</text>
        <text x="365" y="50" fill="#cdd6f4">]</text>
        <text x="15" y="72" fill="#cdd6f4">});</text>
      </g>
    </g>
  </g>
</svg>
